<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1160" viewBox="0 0 1900 1160" role="img" aria-labelledby="title desc">
<title id="title">Goldfish C2SafeRust Workflow</title>
<desc id="desc">Swimlane diagram showing how static tooling, coding agent, review agent, and differential oracle collaborate on the goldfish_address_space migration.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect x="0" y="0" width="1900" height="1160" fill="#FFFFFF"/>
<text x="40" y="30" font-family="Liberation Sans, DejaVu Sans, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Goldfish C2SafeRust Workflow For An External Linux Driver</text>
<text x="40" y="54" font-family="Liberation Sans, DejaVu Sans, Noto Sans, sans-serif" font-size="14" fill="#334155">The workflow combines static artifacts, a constrained coding agent, an independent review agent, and a baseline-vs-candidate differential oracle.</text>
