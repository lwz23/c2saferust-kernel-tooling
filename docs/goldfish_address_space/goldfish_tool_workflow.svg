<text x="276" y="318" font-family="Liberation Sans, DejaVu Sans, Noto Sans, sans-serif" font-size="14" font-weight="400" fill="#0F172A"><tspan x="276" dy="0">Profile the external module</tspan><tspan x="276" dy="1.25em">against kernel-tree landing.</tspan></text>
