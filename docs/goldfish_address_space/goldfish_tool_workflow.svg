<text x="1056" y="710" font-family="Liberation Sans, DejaVu Sans, Noto Sans, sans-serif" font-size="14" font-weight="400" fill="#0F172A"><tspan x="1056" dy="0">Publication, teardown,</tspan><tspan x="1056" dy="1.25em">mmap, and RFC cleanliness.</tspan></text>
<rect x="1320" y="664" width="220" height="80" rx="14" ry="14" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
