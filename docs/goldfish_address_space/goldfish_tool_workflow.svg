<text x="806" y="114" font-family="Liberation Sans, DejaVu Sans, Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#0F172A"><tspan x="806" dy="0">Constrain The Work</tspan></text>
<text x="806" y="136" font-family="Liberation Sans, DejaVu Sans, Noto Sans, sans-serif" font-size="14" font-weight="400" fill="#0F172A"><tspan x="806" dy="0">Accept only artifact-backed</tspan><tspan x="806" dy="1.25em">claims and managed-file</tspan><tspan x="806" dy="1.25em">edits.</tspan></text>
